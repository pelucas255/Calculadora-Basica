
name: Pipeline de calculadora Python

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "9.99"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar operaciones
        run: |
          python -c "from calculator import sumar, restar, multiplicar, dividir; assert sumar(2, 3) == 5; assert restar(5, 2) == 3; assert multiplicar(3, 4) == 12; assert dividir(8, 2) == 4; print('Todas las operaciones funcionan')"